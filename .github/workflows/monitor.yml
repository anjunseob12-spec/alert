name: KOSPI200 KOSDAQ200 스마트 알림

on:
  schedule:
    - cron: "7,23,39,53 0 * * 1-5"
    - cron: "4,19,34,49 1-5 * * 1-5"
    - cron: "4,19,37,51 6 * * 1-5"
    - cron: "41 7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: stock-alert-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -U requests pandas finance-datareader
      - name: Run smart alert bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot_actions.py
      - name: Commit state and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in alert_state.json signal_history.csv volume_curve_history.csv; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "chore: update alert state"
          git push
