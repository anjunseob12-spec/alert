name: KOSPI200 KOSDAQ200 스마트 알림

on:
  schedule:
    # 평일(월~금) KST 09:05 ~ 15:40 구간 10분 간격 실행 (UTC 기준: KST - 9시간)
    - cron: "5,15,25,35,45,55 0 * * 1-5"
    - cron: "0,10,20,30,40,50 1-5 * * 1-5"
    - cron: "0,10,20,30,40 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas finance-datareader lxml beautifulsoup4

      - name: Run smart alert bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: Asia/Seoul
        run: python bot_actions.py

      - name: Commit and push updated state and signal history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alert_state.json signal_history.csv
          if git diff --staged --quiet; then
            echo "변경된 상태/이력 파일이 없습니다."
          else
            git commit -m "chore: update alert state and signal history [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi
